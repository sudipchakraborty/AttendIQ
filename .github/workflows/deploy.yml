name: Deploy AttendIQ to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          ATTENDIQ_GATEWAY_SECRET: ${{ secrets.ATTENDIQ_GATEWAY_SECRET }}
        shell: bash
        run: |
          for setting in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR ATTENDIQ_GATEWAY_SECRET; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing $setting. See README.md for Hostinger setup."
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR must end with a slash."
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl

      - name: Install Node backend
        run: |
          git clone --depth 1 https://github.com/sudipchakraborty/AttendIQ_BackEnd.git ../AttendIQ_BackEnd
          npm ci --prefix ../AttendIQ_BackEnd

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          ATTENDIQ_GATEWAY_SECRET: ${{ secrets.ATTENDIQ_GATEWAY_SECRET }}
        run: npm run lint && npm test && npm run lint:php && npm run test:api && npm run build

      - name: Browser integration against Node
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Verify formatting
        run: npm run format:check

      - name: Check build output
        run: test -f dist/index.html

      - name: Upload production files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
